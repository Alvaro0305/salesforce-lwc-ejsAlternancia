<template>
    <div class="main-image-container">
        <img src={imagenPrincipal} alt="Imagen principal" class="main-image" />
    </div>

    <div class="thumbnails-container">
        <template for:each={imagenesConClase} for:item="imagen">
            <img
                key={imagen.id}
                src={imagen.url}
                alt={imagen.alt}
                data-id={imagen.id}
                onclick={seleccionarImagen}
                class={imagen.claseMinuatura}
            />
        </template>
    </div>
</template>
